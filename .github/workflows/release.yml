name: Build & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-plugin
          path: dist-plugin/
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: dist-plugin

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" \
            main.js \
            styles.css \
            manifest.json \
            versions.json \
            README.md \
            --title "Knowledge Dashboard $VERSION" \
            --notes "## 更新内容\n\n- 读取 Obsidian app.json 排除列表（exclude-folders / exclude-files）\n- 饼图目标文件夹可配置设置项\n- 子目录展开状态持久化（localStorage）\n- 饼图色板扩展至 20 色\n- 版本升级至 ${VERSION}"
